<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快捷待办</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="on-tasks">
  <div class="wrap">
    <div class="card">
      <nav class="pp-top">
        <div class="pp-mode" id="ppMode">
          <button class="pm-btn active" data-mode="todo">TODO</button>
          <button class="pm-btn" data-mode="idea">IDEA</button>
        </div>
        <button class="expand" id="openMain" title="打开主窗口" aria-label="打开主窗口">↗</button>
      </nav>
      <div class="pp-task-add">
        <button class="status-tag" id="ppStatusTag" data-prio="high">今天做完</button>
        <input type="text" id="ppTaskInput" placeholder="回车保存…" maxlength="160" />
        <textarea id="ppIdeaInput" class="pp-idea-input" placeholder="记录想法,回车保存,Shift+Enter 换行…" rows="2" hidden></textarea>
      </div>
      <div class="pp-task-list" id="ppTaskList"></div>
    </div>
  </div>
  <script src="tasks.js"></script>
  <script src="markdown.js"></script>
  <script src="confetti.js"></script>
  <script src="popup.js"></script>
</body>
</html>
