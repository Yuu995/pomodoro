<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>快捷待办</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@200;300;400;500&family=Spline+Sans:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="on-tasks">
  <div class="wrap">
    <div class="card">
      <nav class="pp-top">
        <span class="pp-title">待办</span>
        <button class="expand" id="openMain" title="打开主窗口" aria-label="打开主窗口">↗</button>
      </nav>
      <div class="pp-task-add">
        <button class="status-tag" id="ppStatusTag" data-prio="high">今天做完</button>
        <input type="text" id="ppTaskInput" placeholder="回车保存…" maxlength="160" />
      </div>
      <div class="pp-task-list" id="ppTaskList"></div>
    </div>
  </div>
  <script src="tasks.js"></script>
  <script src="markdown.js"></script>
  <script src="confetti.js"></script>
  <script src="popup.js"></script>
</body>
</html>
