<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ToDo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="on-tasks">
  <div class="settings">
    <!-- 左侧栏(纯白) -->
    <aside class="sidebar">
      <div class="side-brand">TODO</div>
      <nav class="side-nav">
        <button class="side-item active" data-filter="all">
          <span class="side-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="19" y2="6"/><line x1="8" y1="12" x2="19" y2="12"/><line x1="8" y1="18" x2="19" y2="18"/><circle cx="4.6" cy="6" r=".95" fill="currentColor" stroke="none"/><circle cx="4.6" cy="12" r=".95" fill="currentColor" stroke="none"/><circle cx="4.6" cy="18" r=".95" fill="currentColor" stroke="none"/></svg>
          </span>
          <span class="side-label">全部</span>
          <span class="side-cnt" id="cntAll"></span>
        </button>
        <button class="side-item" data-filter="done">
          <span class="side-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.2V12a9 9 0 1 1-5.3-8.2"/><path d="M8.5 11.5l3 3L21.5 5"/></svg>
          </span>
          <span class="side-label">已完成</span>
          <span class="side-cnt" id="cntDone"></span>
        </button>
        <button class="side-item" data-filter="trash">
          <span class="side-ico">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg>
          </span>
          <span class="side-label">回收站</span>
          <span class="side-cnt" id="cntTrash"></span>
        </button>
      </nav>
    </aside>

    <!-- 右侧内容(纯白) -->
    <main class="content">
      <header class="content-bar">
        <button class="side-toggle" id="sideToggle" title="收起任务栏" aria-label="收起或展开任务栏">«</button>
        <span class="bar-grow"></span>
        <div class="view-toggle" id="viewToggle">
          <button class="vt-btn active" data-mode="list" title="列表视图">≣</button>
          <button class="vt-btn" data-mode="calendar" title="日历视图">▦</button>
        </div>
        <button class="theme-btn" id="themeBtn" title="切换主题:跟随系统 / 浅色 / 深色" aria-label="主题">◐</button>
      </header>
      <div class="content-body">
        <h1 class="content-title" id="contentTitle">全部</h1>
        <div class="task-add" id="taskAdd">
          <button class="status-tag" id="statusTag" data-prio="high">今天做完</button>
          <input type="text" id="taskInput" placeholder="添加待办,回车保存…" maxlength="160" />
        </div>
        <div class="task-list" id="taskList"></div>
        <div class="calendar" id="calendar" hidden></div>
      </div>
    </main>
  </div>

  <script src="tasks.js"></script>
  <script src="markdown.js"></script>
  <script src="confetti.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
